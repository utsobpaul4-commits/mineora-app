<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mineora Admin Panel</title>
    <style>
        body { font-family: sans-serif; background: #1e293b; color: white; padding: 20px; }
        .box { background: #334155; padding: 20px; border-radius: 10px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { background: #0ea5e9; color: white; font-weight: bold; }
    </style>
</head>
<body>
    <h2>👑 Mineora Admin Panel</h2>
    <div class="box">
        <h3>🎯 Add New Task</h3>
        <input type="text" id="tName" placeholder="Task Name">
        <input type="text" id="tLink" placeholder="Task Link">
        <button onclick="alert('Task Added!')">Add Task</button>
    </div>
</body>
</html>
